name: CI

on:
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  test:
    name: Run Tests (Ubuntu)
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-ci.txt
          pip install -r tests/requirements-test.txt

      - name: Run tests
        run: pytest --tb=short -q -m "not requires_audio and not requires_external_exe and not requires_llm"

  build:
    name: Build Mod Archive (Windows)
    # Mantella.exe is a Windows program (it runs under Proton on Linux), so it is built on Windows.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r packaging/requirements-build.txt

      - name: Build mod archive
        run: python packaging/build_mod_archive.py

      - name: Confirm the archive exists
        shell: bash
        run: |
          ls dist/Mantella-Skyrim-*.zip
          unzip -l dist/Mantella-Skyrim-*.zip | grep -q "SKSE/Plugins/MantellaSoftware/Mantella.exe"
          unzip -l dist/Mantella-Skyrim-*.zip | grep -q " Mantella.esp"
          unzip -l dist/Mantella-Skyrim-*.zip | grep -q "SKSE/Plugins/MantellaSoftware/piper/piper.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mod-archive-ci
          path: dist/Mantella-Skyrim-*.zip
          retention-days: 7
