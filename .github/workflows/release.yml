name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write   # needed to create releases and upload assets

jobs:
  test:
    name: Run Tests (Ubuntu)
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-ci.txt
          pip install -r tests/requirements-test.txt

      - name: Run tests
        run: pytest --tb=short -q -m "not requires_audio and not requires_external_exe and not requires_llm"

  skse:
    name: Build SKSE Plugins (Windows)
    # The four .dll files the mod needs, built from the sources in skse/ (see skse/README.md).
    # The mod archive is still built if this job fails; it then does not contain the plugins.
    runs-on: windows-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache vcpkg packages
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}\vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('skse/vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Configure
        shell: pwsh
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-binary-cache
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\vcpkg-binary-cache" | Out-Null
          # CommonLibSSE-NG is built from source: without GITHUB_ACTIONS it does not look for a prebuilt bundle.
          Remove-Item Env:GITHUB_ACTIONS -ErrorAction SilentlyContinue
          $vcpkg = if ($env:VCPKG_ROOT) { $env:VCPKG_ROOT } else { $env:VCPKG_INSTALLATION_ROOT }
          # No generator is named, so CMake uses the Visual Studio installed on the runner (which finds the compiler itself)
          cmake -S skse -B build/skse -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL

      - name: Build
        shell: pwsh
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-binary-cache
        run: cmake --build build/skse --config Release

      - name: Confirm the plugins exist
        shell: bash
        run: |
          ls build/skse/plugins/MantellaDialogue.dll build/skse/plugins/MantellaLauncher.dll
          ls build/skse/plugins/MantellaSubtitles.dll build/skse/plugins/SKSE_HTTP.dll

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: skse-plugins
          path: build/skse/plugins/*.dll

  build:
    name: Build Mod Archive (Windows)
    # Mantella.exe is a Windows program (it runs under Proton on Linux), so it is built on Windows.
    runs-on: windows-latest
    needs: [test, skse]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        # bash stops at the first command that fails. (PowerShell carries on, which once let a failed install
        # through and produced a Mantella.exe without its libraries.)
        shell: bash
        env:
          PIP_BUILD_CONSTRAINT: packaging/build-constraints.txt
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r packaging/requirements-build.txt

      - name: Download SKSE plugins
        # Missing if the SKSE plugin build failed: the archive is then built without them.
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: skse-plugins
          path: dist/skse

      - name: Build mod archive
        run: python packaging/build_mod_archive.py

      - name: Check that Mantella.exe starts
        # Loads every library Mantella uses and exits. Fails if one of them is missing from the build.
        shell: bash
        run: dist/Mantella/Mantella.exe --smoke-test

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mod-archive
          path: dist/Mantella-Skyrim-*.zip

  release:
    name: Create GitHub Release
    runs-on: ubuntu-26.04
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Read version
        id: tag
        run: |
          VERSION=$(jq -r '.app_version' version.json)
          # "prerelease" in version.json (eg "beta.1") makes this a pre-release: 0.17.0-beta.1. Empty or missing: a normal release
          PRERELEASE=$(jq -r '.prerelease // ""' version.json)
          if [ -n "$PRERELEASE" ]; then
            VERSION="$VERSION-$PRERELEASE"
            echo "IS_PRERELEASE=true" >> "$GITHUB_OUTPUT"
          else
            echo "IS_PRERELEASE=false" >> "$GITHUB_OUTPUT"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "TAG=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "NAME=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download mod archive
        uses: actions/download-artifact@v8
        with:
          name: mod-archive

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          name: ${{ steps.tag.outputs.NAME }}
          body: |
            Automated release built from commit ${{ github.sha }}.

            **Commit message:** ${{ github.event.head_commit.message }}

            > Replaces the [Mantella mod](https://www.nexusmods.com/skyrimspecialedition/mods/98631) from Nexus Mods. The Piper voices are not in the archive: Mantella downloads them by itself the first time they are needed.

            ## Downloads

            | File | Description |
            |------|-------------|
            | `Mantella-Skyrim-${{ steps.tag.outputs.VERSION }}.zip` | Mod archive for Mod Organizer 2 / Vortex, for Skyrim Special Edition |

            ## Installation

            1. Install `Mantella-Skyrim-${{ steps.tag.outputs.VERSION }}.zip` with your mod manager ("Install a new mod from an archive" in Mod Organizer 2).
            2. Paste your LLM secret key into `GPT_SECRET_KEY.txt` in the installed mod's folder.
            3. Disable the Mantella mod from Nexus Mods.

            > This is a community build, a fork of [Mantella](https://github.com/art-from-the-machine/Mantella) with fixes for Skyrim and for Linux (Proton). See the [README](https://github.com/${{ github.repository }}/blob/main/README.md) for what is different.
          files: |
            Mantella-Skyrim-${{ steps.tag.outputs.VERSION }}.zip
          prerelease: ${{ steps.tag.outputs.IS_PRERELEASE == 'true' }}
          make_latest: ${{ steps.tag.outputs.IS_PRERELEASE != 'true' }}
