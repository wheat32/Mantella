name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write   # needed to create releases and upload assets

jobs:
  test:
    name: Run Tests (Ubuntu)
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-ci.txt
          pip install -r tests/requirements-test.txt

      - name: Run tests
        run: pytest --tb=short -q -m "not requires_audio and not requires_external_exe and not requires_llm"

  build:
    name: Build Mod Archive (Windows)
    # Mantella.exe is a Windows program (it runs under Proton on Linux), so it is built on Windows.
    runs-on: windows-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r packaging/requirements-build.txt

      - name: Build mod archive
        run: python packaging/build_mod_archive.py

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mod-archive
          path: dist/Mantella-Skyrim-*.zip

  release:
    name: Create GitHub Release
    runs-on: ubuntu-26.04
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Read version
        id: tag
        run: |
          VERSION=$(jq -r '.app_version' version.json)
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "TAG=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "NAME=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download mod archive
        uses: actions/download-artifact@v8
        with:
          name: mod-archive

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          name: ${{ steps.tag.outputs.NAME }}
          body: |
            Automated release built from commit ${{ github.sha }}.

            **Commit message:** ${{ github.event.head_commit.message }}

            > **This is not the complete mod.** The archive contains the Mantella software only. You also need the [Mantella mod](https://www.nexusmods.com/skyrimspecialedition/mods/98631) from Nexus Mods and its requirements, which provide the game plugin, scripts and SKSE plugins.

            ## Downloads

            | File | Description |
            |------|-------------|
            | `Mantella-Skyrim-${{ steps.tag.outputs.VERSION }}.zip` | Mod archive for Mod Organizer 2 / Vortex, for Skyrim Special Edition |

            ## Installation

            1. Install [Mantella](https://www.nexusmods.com/skyrimspecialedition/mods/98631) and its requirements with your mod manager.
            2. Install `Mantella-Skyrim-${{ steps.tag.outputs.VERSION }}.zip` as a separate mod ("Install a new mod from an archive" in Mod Organizer 2).
            3. Let it overwrite Mantella. In Mod Organizer 2, place it below Mantella in the mod list. In Vortex, set it to load after Mantella.

            To go back to the original software, disable or remove this mod.

            > This is a community build, a fork of [Mantella](https://github.com/art-from-the-machine/Mantella) with fixes for Skyrim and for Linux (Proton). See the [README](https://github.com/${{ github.repository }}/blob/main/README.md) for what is different.
          files: |
            Mantella-Skyrim-${{ steps.tag.outputs.VERSION }}.zip
          make_latest: true
